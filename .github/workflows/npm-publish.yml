name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing: lets the job mint an OIDC token
      # that npm verifies instead of a long-lived NPM_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      # Trusted publishing needs npm >= 11.5.1; pin ahead of whatever ships.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # No NODE_AUTH_TOKEN: npm authenticates over OIDC and attaches provenance.
      - run: npm publish --access public
